name: Determinant downloaded-artifact integrity controls

'on':
  push:
    branches: ['cbz/determinant-artifact-integrity-20261029']
    paths:
      - 'frontiers/determinant_moment_20261025/**'
      - '.github/workflows/cbz-determinant-artifact-integrity.yml'
  pull_request:
    paths:
      - 'frontiers/determinant_moment_20261025/artifact_integrity.py'
      - 'frontiers/determinant_moment_20261025/tests/test_artifact_integrity.py'
      - 'frontiers/determinant_moment_20261025/artifact-integrity-requests.json'
      - '.github/workflows/cbz-determinant-artifact-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  downloaded-byte-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Nonzero component tests and twelve intended source mutations in both modes
        run: |
          set -euo pipefail
          mkdir -p .cbz-determinant-wire-evidence
          for mode in normal optimized; do
            flags=''
            if [ "$mode" = optimized ]; then flags='-O'; fi
            python -B -S $flags -m unittest discover -s frontiers/determinant_moment_20261025/tests -p 'test_*.py' -v > ".cbz-determinant-wire-evidence/tests-$mode.log" 2>&1
            python -B -S $flags frontiers/determinant_moment_20261025/tests/run_cbz_mutations.py --output "$RUNNER_TEMP/determinant-wire-mutations-$mode" > ".cbz-determinant-wire-evidence/mutations-$mode.log" 2>&1
            cp -R "$RUNNER_TEMP/determinant-wire-mutations-$mode" ".cbz-determinant-wire-evidence/mutations-$mode"
          done
      - name: Preserve and expose any test or mutation failure before archive inspection
        if: always()
        run: |
          for mode in normal optimized; do
            if [ -d "$RUNNER_TEMP/determinant-wire-mutations-$mode" ] && [ ! -d ".cbz-determinant-wire-evidence/mutations-$mode" ]; then
              cp -R "$RUNNER_TEMP/determinant-wire-mutations-$mode" ".cbz-determinant-wire-evidence/mutations-$mode"
            fi
          done
          for log in .cbz-determinant-wire-evidence/tests-*.log .cbz-determinant-wire-evidence/mutations-*.log; do
            if [ -f "$log" ]; then tail -n 100 "$log"; fi
          done
      - name: Download immutable old-negative and repaired-positive artifacts and inspect every log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -S - <<'PYARTIFACT'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path('frontiers/determinant_moment_20261025')
          out=Path('.cbz-determinant-wire-evidence')
          requests=json.loads((root/'artifact-integrity-requests.json').read_text())
          if len(requests)!=2 or {r['label'] for r in requests}!={'historical-negative','repaired-positive'}:
              raise SystemExit('both immutable positive and negative artifact controls are required')
          rows=[]
          for request in requests:
              work=out/request['label']
              work.mkdir(parents=True)
              archive=work/'artifact.zip'
              with archive.open('wb') as destination:
                  subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(request['artifact_id'])+'/zip'],
                                 stdout=destination,check=True)
              digest=hashlib.sha256(archive.read_bytes()).hexdigest()
              if digest!=request['archive_sha256']:
                  raise SystemExit('downloaded ZIP differs from the independently recorded GitHub artifact digest')
              for mode in ['normal','optimized']:
                  report=work/(mode+'.json')
                  command=[sys.executable,'-B','-S']+(['-O'] if mode=='optimized' else [])+[
                      str(root/'artifact_integrity.py'),'--archive',str(archive),
                      '--expected-commit',request['checked_commit'],
                      '--expected-manifest',request['manifest_sha256'],'--output',str(report)]
                  run=subprocess.run(command,capture_output=True,text=True)
                  (work/(mode+'.stdout')).write_text(run.stdout)
                  (work/(mode+'.stderr')).write_text(run.stderr)
                  result=json.loads(report.read_text())
                  if run.returncode!=request['expected_exit'] or result.get('status')!=request['expected_status']:
                      raise SystemExit('artifact control did not reach its exact expected disposition')
                  if request['expected_status']=='FAIL':
                      if result.get('code')!=request['expected_code'] or result.get('error')!=request['expected_error']:
                          raise SystemExit('negative artifact failed for the wrong reason')
                  elif result.get('verified_log_count')!=request['expected_verified_logs']:
                      raise SystemExit('positive artifact did not verify every expected log')
                  rows.append(dict(label=request['label'],mode=mode,exit=run.returncode,
                                   archive_sha256=digest,report=result))
          summary=dict(schema_version=1,status='PASS',scope='BYTE_TRANSPORT_CONTROLS_ONLY_NO_KERNEL_CREDIT',
                       checker_sha256=hashlib.sha256((root/'artifact_integrity.py').read_bytes()).hexdigest(),
                       checked_tool_commit=os.environ['GITHUB_SHA'],controls=rows)
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PYARTIFACT
      - name: Seal verified raw ZIPs and reports in a recoverable Git evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -S - <<'PYSEAL'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          repository=os.environ['GITHUB_REPOSITORY']
          endpoint='repos/'+repository+'/'
          def api(path,body=None):
              command=['gh','api',endpoint+path]
              raw=None
              if body is not None:
                  command+=['--method','POST','--input','-']
                  raw=json.dumps(body).encode()
              run=subprocess.run(command,input=raw,capture_output=True,check=True)
              return json.loads(run.stdout)
          source=Path('.cbz-determinant-wire-evidence')
          summary=json.loads((source/'SUMMARY.json').read_text())
          if summary.get('status')!='PASS' or len(summary.get('controls',[]))!=4:
              raise SystemExit('only fully verified actual archive controls may be sealed')
          prefix='evidence/cbz-determinant-transport-20261029/'
          files={'SUMMARY.json':(source/'SUMMARY.json').read_bytes()}
          for label in ['historical-negative','repaired-positive']:
              for name in ['artifact.zip','normal.json','optimized.json']:
                  relative=label+'/'+name
                  files[relative]=(source/relative).read_bytes()
          manifest=''.join(hashlib.sha256(raw).hexdigest()+'  '+path+'\n' for path,raw in sorted(files.items()))
          files['SHA256SUMS']=manifest.encode()
          files['README.md']=(
              '# Verified determinant transport evidence\n\n'
              'Collected by actual workflow run'+os.environ['GITHUB_RUN_ID']+
              ', attempt'+os.environ['GITHUB_RUN_ATTEMPT']+', tool source'+os.environ['GITHUB_SHA']+'.\n'
              'Raw ZIPs preserve both the historical self-hash failure and the repaired21-log receipt.\n'
              'SUMMARY.json and the four mode reports record actual outcomes. This is byte-transport\n'
              'evidence only; it awards no new mathematical theorem or federation CBZ status.\n'
              'Run sha256sum -c SHA256SUMS here, then artifact_integrity.py on each raw ZIP using\n'
              'the independent commit/manifest identities in artifact-integrity-requests.json.\n'
          ).encode()
          def blob(item):
              path,raw=item
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              result=api('git/blobs',dict(encoding='base64',content=base64.b64encode(raw).decode()))
              if result.get('sha')!=expected:
                  raise SystemExit('Git blob identity differs from the exact archived bytes')
              return dict(path=prefix+path,mode='100644',type='blob',sha=expected)
          with ThreadPoolExecutor(max_workers=4) as pool:
              entries=list(pool.map(blob,sorted(files.items())))
          original=api('git/commits/'+os.environ['GITHUB_SHA'])
          tree=api('git/trees',dict(base_tree=original['tree']['sha'],tree=entries))
          commit=api('git/commits',dict(message='Preserve actual verified determinant ZIPs and source-bound reports',
                                     tree=tree['sha'],parents=[os.environ['GITHUB_SHA']]))
          branch='cbz/determinant-wire-evidence-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          api('git/refs',dict(ref='refs/heads/'+branch,sha=commit['sha']))
          readback=api('git/trees/'+commit['tree']['sha']+'?recursive=1')
          if readback.get('truncated'):
              raise SystemExit('archive tree readback was truncated')
          actual={row['path']:row['sha'] for row in readback['tree']}
          if any(actual.get(row['path'])!=row['sha'] for row in entries):
              raise SystemExit('archive tree readback differs from the verified byte identities')
          report=dict(schema_version=1,status='PUBLISHED_AND_READBACK_MATCHED',branch=branch,
                      commit=commit['sha'],tree=tree['sha'],source_tool_commit=os.environ['GITHUB_SHA'],
                      files={prefix+path:hashlib.sha256(raw).hexdigest() for path,raw in sorted(files.items())})
          (source/'PUBLICATION.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          PYSEAL
      - name: Preserve raw downloaded ZIPs, positive and intended-negative reports and mutation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: determinant-downloaded-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cbz-determinant-wire-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
