name: Small-lifetime shape and moment crossover checks

'on':
  pull_request:
    paths:
      - 'frontiers/small_lifetime_shape_20260930/**'
      - '.github/workflows/small-lifetime-shape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Fetch exact public source commits
        run: |
          set -euo pipefail
          git fetch --no-tags origin ae343a1c2a0070476fed4d31a15b6911831edd4d
          git fetch --no-tags origin 56a7904f9ad7d409c31e23195c0e7eeab230613a
      - name: Verify both sources, packet and exact controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/small_lifetime_shape_20260930/verify.py
          git diff --exit-code
