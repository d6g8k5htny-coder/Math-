name: Lifetime parent import custody

'on':
  pull_request:
    paths:
      - 'imports/lifetime_parent_20260925/**'
      - 'claims/LANDING_CLAIMS.json'
      - '.github/workflows/lifetime-parent-imports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Verify exact imported bytes
        run: python -B -S imports/lifetime_parent_20260925/verify.py
