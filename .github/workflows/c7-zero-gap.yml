name: C7 zero-gap finite controls

'on':
  pull_request:
    paths:
      - 'frontiers/c7_zero_gap_limit_20260929/**'
      - '.github/workflows/c7-zero-gap.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/c7_zero_gap_limit_20260929/**'
      - '.github/workflows/c7-zero-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-zero-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Exact sources, both Python modes, semantic and path negatives
        run: |
          set -euo pipefail
          P=frontiers/c7_zero_gap_limit_20260929
          python -B -S "$P/check.py" --verify-sources "$GITHUB_WORKSPACE"
          python -B -S "$P/check.py" > "$RUNNER_TEMP/zero-gap-normal.json"
          python -B -O -S "$P/check.py" > "$RUNNER_TEMP/zero-gap-optimized.json"
          cmp "$P/RESULTS.json" "$RUNNER_TEMP/zero-gap-normal.json"
          cmp "$RUNNER_TEMP/zero-gap-normal.json" "$RUNNER_TEMP/zero-gap-optimized.json"
          python -B -S "$P/test_check.py" -v
          python -B -O -S "$P/test_check.py" -v
          git diff --exit-code
