name: P15 overlapping-block exact controls

'on':
  pull_request:
    paths:
      - 'frontiers/p15_bipartite_overlap_20260928/**'
      - '.github/workflows/p15-bipartite-overlap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify exact sources and both-mode semantic controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/p15_bipartite_overlap_20260928/run_validation.py
          git diff --exit-code
