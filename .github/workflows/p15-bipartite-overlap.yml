name: P15 overlapping-block exact controls

'on':
  pull_request:
    paths:
      - 'frontiers/p15_bipartite_overlap_20260928/**'
      - '.github/workflows/p15-bipartite-overlap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Verify exact sources and both-mode semantic controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/p15_bipartite_overlap_20260928/run_validation.py
          git diff --exit-code
