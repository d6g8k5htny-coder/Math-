name: C8 planar Theorem A constants (certified replay)

'on':
  pull_request:
    paths:
      - 'frontiers/c8_theorem_a_constants_planar_20260930/**'
      - '.github/workflows/c8-theorem-a-constants-planar.yml'
      - 'tools/**'
      - 'tools.py'
      - 'tests/test_check_mode_workflows.py'
      - 'tests/test_legacy_workflow_triggers.py'
      - 'imports/lifetime_parent_20260925/UNIFORM_MATRIX_CAP_AND_LIFETIME.md'
      - 'imports/lifetime_parent_20260925/MARKED_CYLINDER_CAP_PROOF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Check trigger coverage and the complete shell rejection contract in both modes
        env:
          CHECK_MODE_TEST_FAMILY: 'c8-theorem-a-constants-planar'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -S tests/test_check_mode_workflows.py
          python -B -O -S tests/test_check_mode_workflows.py
      - name: Verify manifest and main-resident pins, replay every band and the C table in both interpreter modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/c8_theorem_a_constants_planar_20260930').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          if present != sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json']):
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          pins = json.loads((root / 'SOURCE_MAP.json').read_text())
          for entry in pins['sources']:
              if not entry['current_required']:
                  continue
              data = pathlib.Path(entry['path']).read_bytes()
              blob = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or blob != entry['git_blob']:
                  raise ValueError('consumed source identity mismatch on this tree: ' + entry['path'])
          # every one of the 153 bands in one mode, the sampled replay in the other
          from tools.check_mode_replay import replay
          replay('c8-theorem-a-constants-planar', root)
          print(json.dumps({'scientific_effect': 'NONE', 'bands_replayed': 153, 'mutants_rejected': 4}))
          PY
          git diff --exit-code
