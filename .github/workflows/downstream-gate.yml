name: Downstream hard-gate exact replay
'on':
  push:
    branches: [cursor/downstream-hard-gate-91fa]
  pull_request:
    paths: ['frontiers/downstream_gate_20260925/**', '.github/workflows/downstream-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify sources and run gate controls plus regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -S - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/downstream_gate_20260925').resolve()
          pins = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          def verify():
              mismatches = []
              for name, identity in pins.items():
                  if pathlib.PurePosixPath(name).name != name or (root / name).is_symlink():
                      raise ValueError('flat regular source required')
                  raw = (root / name).read_bytes()
                  digest = hashlib.sha256(raw).hexdigest()
                  if len(raw) != identity['bytes'] or digest != identity['sha256']:
                      print('SOURCE_IDENTITY_ACTUAL', name, len(raw), digest)
                      mismatches.append(name)
              if mismatches:
                  raise ValueError('source identity mismatches: ' + ','.join(mismatches))
          if sys.version_info[:2] != (3, 11):
              raise RuntimeError('actual Python 3.11 required')
          verify()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'downstream-gate-results'
          subprocess.run([sys.executable, '-B', '-S', str(root / 'run_validation.py'), '--output', str(out)], check=True, timeout=120)
          regressions = [
              ('coefficients/side24_v1', 30),
              ('frontiers/three_fronts_20260924', 57),
              ('frontiers/price_budget_20260924', 26),
              ('frontiers/full_price_20260924', 36),
              ('frontiers/remote_window_20260924', 28),
          ]
          for mode, flags in [('normal', []), ('optimized', ['-O'])]:
              for index, (folder, count) in enumerate(regressions):
                  run = subprocess.run(
                      [sys.executable, '-B', *flags, '-S', '-m', 'unittest', 'discover', '-s', folder, '-p', 'test_*.py', '-v'],
                      capture_output=True, text=True, timeout=90,
                  )
                  (out / f'regression_{mode}_{index}.stdout').write_text(run.stdout)
                  (out / f'regression_{mode}_{index}.stderr').write_text(run.stderr)
                  if run.returncode or f'Ran {count} tests' not in run.stderr or 'skipped=' in run.stderr:
                      raise RuntimeError('regression failed: ' + folder)
          verify()
          report = json.loads((out / 'REPORT.json').read_text())
          if not report['passed'] or report['distinct_tests'] != 32 or report['distinct_semantic_mutations'] != 10:
              raise RuntimeError('unexpected new-test scope')
          (out / 'GITHUB_CONTEXT.json').write_text(json.dumps({
              'run': os.environ['GITHUB_RUN_ID'],
              'sha': os.environ['GITHUB_SHA'],
              'python': sys.version,
              'new_distinct_tests': 32,
              'regression_distinct_tests': 177,
              'total_distinct_tests': 209,
              'new_semantic_mutations': 10,
              'source_files_verified': len(pins),
              'lemma_closed': False,
              'scientific_effect': 'NONE',
              'meaning': 'same-author integrity-gate checks; not analytic review',
          }, indent=2) + '\n')
          print('DOWNSTREAM_GATE_PASSED')
          PY
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: downstream-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/downstream-gate-results
          if-no-files-found: error
          retention-days: 30