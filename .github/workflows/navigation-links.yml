name: Navigation document links and quotations

'on':
  pull_request:
    paths:
      - 'PROOF_INDEX.md'
      - 'docs/integration/**'
      - 'tools/check_doc_links.py'
      - 'tools/check_doc_quotes.py'
      - 'tests/test_navigation_links.py'
      - 'tests/test_navigation_quotes.py'
      - '.github/workflows/navigation-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-relative-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Resolve every link from the containing document and authenticate every navigation quotation, in both interpreter modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -S tools/check_doc_links.py PROOF_INDEX.md docs/integration/*.md
          python -B -O -S tools/check_doc_links.py PROOF_INDEX.md docs/integration/*.md
          python -B -S tools/check_doc_quotes.py --github --require-online PROOF_INDEX.md docs/integration/2026-09-29-navigation-refresh.md
          python -B -O -S tools/check_doc_quotes.py --github --require-online PROOF_INDEX.md docs/integration/2026-09-29-navigation-refresh.md
          python -B -S -m unittest -v tests.test_navigation_links tests.test_navigation_quotes
          python -B -O -S -m unittest -v tests.test_navigation_links tests.test_navigation_quotes
          git diff --exit-code
