name: C7-total bounded-difference checks

'on':
  pull_request:
    paths:
      - 'frontiers/c7_total_bounded_20260929/**'
      - '.github/workflows/c7-total-bounded.yml'
      - 'tests/test_c7_total_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Exercise C7 wrapper rejection contracts in both modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s tests -p test_c7_total_workflow.py -v
          python -B -O -S -m unittest discover -s tests -p test_c7_total_workflow.py -v
      - name: Verify sources, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/c7_total_bounded_20260929').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          script = str(root / 'exponent_check.py')
          expected = (root / 'RESULTS.json').read_bytes()
          # Independently measured from unchanged exponent_check.py blob 0f9d4cf4.
          # Exact FAIL lines (including newline), not a substring or learned oracle.
          failures = {
              'M1': b'FAIL T_pieceB1_7_12\n',
              'M2': b'FAIL T_threshold_is_r_equals_k\n',
              'M3': b'FAIL K_62prime_layer_integral_exact\n',
          }
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script],
                                   check=True, capture_output=True, timeout=300)
              if out.stdout != expected or out.stderr != b'':
                  raise RuntimeError('baseline output or stderr differs under ' + ' '.join(flags))
              print(json.dumps({'stage': 'baseline', 'flags': flags, 'returncode': out.returncode,
                                'stdout_sha256': hashlib.sha256(out.stdout).hexdigest(),
                                'stderr_sha256': hashlib.sha256(out.stderr).hexdigest()}), flush=True)
              for m, diagnostic in failures.items():
                  out = subprocess.run([sys.executable, *flags, script, '--mutant', m],
                                       capture_output=True, timeout=300)
                  if out.returncode != 1 or out.stdout != diagnostic or out.stderr != b'':
                      raise RuntimeError('mutant ' + m + ' did not report its intended rejection')
                  print(json.dumps({'stage': m, 'flags': flags, 'returncode': out.returncode,
                                    'stdout_sha256': hashlib.sha256(out.stdout).hexdigest(),
                                    'stderr_sha256': hashlib.sha256(out.stderr).hexdigest()}), flush=True)
          print(json.dumps({'scientific_effect': 'NONE', 'scientific_acceptance': False}))
          PY
          git diff --exit-code
