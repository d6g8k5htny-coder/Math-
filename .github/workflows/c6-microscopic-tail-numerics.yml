name: C6 microscopic tail numerics (replay)

'on':
  pull_request:
    paths:
      - 'frontiers/c6_microscopic_tail_numerics_20260930/**'
      - '.github/workflows/c6-microscopic-tail-numerics.yml'
      - 'frontiers/two_scale_cluster_geometry_20260929/RADIAL_TAIL.md'
      - 'frontiers/spectral_cluster_closure_20260929/PROOF.md'
      - 'frontiers/c6_cluster_coefficients_numerics_20260930/RESULTS.json'
      - 'frontiers/planar_cubic_cluster_20260929/PROOF.md'
      - 'imports/lifetime_parent_20260925/UNIFORM_MATRIX_CAP_AND_LIFETIME.md'
      - 'frontiers/extreme_cluster_sampling_20260930/PROOF.md'
      - 'frontiers/radial_rate_20260930/PROOF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Verify manifest and main-resident pins, replay exact controls and sample kernels, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/c6_microscopic_tail_numerics_20260930').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          if present != sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json']):
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          pins = json.loads((root / 'SOURCE_MAP.json').read_text())
          for entry in pins['sources']:
              if not entry['current_required']:
                  continue
              data = pathlib.Path(entry['path']).read_bytes()
              blob = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or blob != entry['git_blob']:
                  raise ValueError('consumed source identity mismatch on this tree: ' + entry['path'])
          validator_source = r'''
class Result:
    def __init__(self, returncode, stdout=b"", stderr=b""):
        self.returncode = returncode
        self.stdout = stdout
        self.stderr = stderr

def validate_baseline(result):
    expected = b'{"check": "ok", "mutant": null}\\n'
    if result.returncode != 0 or result.stdout != expected or result.stderr != b"":
        raise ValueError("baseline output contract mismatch")

def validate_mutant(result, diagnostic):
    expected = ("FAIL: " + diagnostic + "\\n").encode("utf-8")
    if result.returncode != 1 or result.stdout != expected or result.stderr != b"":
        raise ValueError("mutant output contract mismatch: " + diagnostic)

def reject(fn, result, *args):
    try:
        fn(result, *args)
    except ValueError:
        return
    raise AssertionError("invalid child result was accepted")

def synthetic_controls():
    baseline = b'{"check": "ok", "mutant": null}\\n'
    validate_baseline(Result(0, baseline, b""))
    for bad in (
        Result(0, b"not-json\\n", b""),
        Result(0, baseline, b"unexpected stderr\\n"),
        Result(0, baseline + b"extra\\n", b""),
        Result(1, baseline, b""),
    ):
        reject(validate_baseline, bad)

    expected = {
        "shape-integral": "I = 246528/35",
        "gamma-power": "cusp integral replay J_cusp k=0.5",
        "cusp-shift": "cusp integral replay J_cusp k=0.5",
    }
    for mutant, diagnostic in expected.items():
        valid = ("FAIL: " + diagnostic + "\\n").encode("utf-8")
        validate_mutant(Result(1, valid, b""), diagnostic)
        wrong_label = b'{"check": "ok", "mutant": "wrong-mutant"}\\n'
        for bad in (
            Result(1, b"", b"Traceback (most recent call last): RuntimeError\\n"),
            Result(1, b"", b""),
            Result(1, b"FAIL: unrelated failure\\n", b""),
            Result(1, valid, b"unexpected stderr\\n"),
            Result(0, valid, b""),
            Result(1, baseline, b""),
            Result(1, wrong_label, b""),
        ):
            reject(validate_mutant, bad, diagnostic)
'''

          validator_namespace = {}
          exec(validator_source, validator_namespace)
          validate_baseline = validator_namespace['validate_baseline']
          validate_mutant = validator_namespace['validate_mutant']
          synthetic_code = validator_source + "\\nsynthetic_controls()\\nprint('synthetic process-predicate controls passed')\\n"
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              probe = subprocess.run([sys.executable, *flags, '-c', synthetic_code], capture_output=True, timeout=30)
              if probe.returncode != 0 or probe.stderr != b'' or probe.stdout != b'synthetic process-predicate controls passed\\n':
                  raise RuntimeError('synthetic process-predicate controls failed under ' + ' '.join(flags) +
                                     ': stdout=' + repr(probe.stdout) + ' stderr=' + repr(probe.stderr))

          script = str(root / 'tail_constants.py')
          expected_mutants = {
              'shape-integral': 'I = 246528/35',
              'gamma-power': 'cusp integral replay J_cusp k=0.5',
              'cusp-shift': 'cusp integral replay J_cusp k=0.5',
          }
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              baseline = subprocess.run([sys.executable, *flags, script, '--check'], cwd=root, capture_output=True, timeout=900)
              try:
                  validate_baseline(baseline)
              except ValueError as exc:
                  raise RuntimeError('baseline contract failed under ' + ' '.join(flags) +
                                     ': rc=' + str(baseline.returncode) + ' stdout=' + repr(baseline.stdout) +
                                     ' stderr=' + repr(baseline.stderr)) from exc
              for mutant, diagnostic in expected_mutants.items():
                  result = subprocess.run([sys.executable, *flags, script, '--check', '--mutant', mutant],
                                          cwd=root, capture_output=True, timeout=900)
                  try:
                      validate_mutant(result, diagnostic)
                  except ValueError as exc:
                      raise RuntimeError('mutant ' + mutant + ' contract failed under ' + ' '.join(flags) +
                                         ': rc=' + str(result.returncode) + ' stdout=' + repr(result.stdout) +
                                         ' stderr=' + repr(result.stderr)) from exc
          print(json.dumps({'scientific_effect': 'NONE', 'certified': False}))
          PY
          git diff --exit-code
