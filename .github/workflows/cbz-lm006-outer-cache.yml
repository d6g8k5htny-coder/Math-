name: CBZ LM006 outer test cache
on:
  push:
    branches: [cbz/lm006-outer-test-cache-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outer-test-cache:
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Run source-only controlled workflow experiment
        env:
          CBZ_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          while IFS='=' read -r variable _; do
            case "$variable" in PYTHON*) unset "$variable" ;; esac
          done < <(env)
          outer_cache=$(mktemp -d "$RUNNER_TEMP/lm006-control-pyc.XXXXXXXX")
          export PYTHONPYCACHEPREFIX="$outer_cache"
          export PYTHONDONTWRITEBYTECODE=1
          flags=()
          if [ "$CBZ_MODE" = optimized ]; then flags=(-O); fi
          python -B -S "${flags[@]}" cbz/verification/lm006_outer_cache/test_entry.py
