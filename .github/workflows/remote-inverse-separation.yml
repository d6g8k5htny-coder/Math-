name: Remote inverse-separation finite controls

'on':
  pull_request:
    paths:
      - 'frontiers/remote_inverse_separation_20260928/**'
      - '.github/workflows/remote-inverse-separation.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/remote_inverse_separation_20260928/**'
      - '.github/workflows/remote-inverse-separation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-inverse-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify exact packet and both-mode intended negatives
        run: |
          set -euo pipefail
          python -B -S frontiers/remote_inverse_separation_20260928/verify.py --output "${RUNNER_TEMP}/inverse-separation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --exit-code
