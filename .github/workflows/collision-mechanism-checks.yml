name: Collision geometry and transfer exact checks
'on':
  pull_request:
    paths: ['reviews/collision_mechanism_20260925/**', '.github/workflows/collision-mechanism-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Run both exact modes and retain source identities
        run: |
          set -euo pipefail
          pkg=reviews/collision_mechanism_20260925
          out="$RUNNER_TEMP/collision-mechanism"
          mkdir -p "$out"
          python -B -S "$pkg/exact_checks.py" > "$out/normal.stdout" 2> "$out/normal.stderr"
          python -B -O -S "$pkg/exact_checks.py" > "$out/optimized.stdout" 2> "$out/optimized.stderr"
          python -B -S - <<'PY'
          import hashlib,json,os,pathlib,sys
          root=pathlib.Path('reviews/collision_mechanism_20260925')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'collision-mechanism'
          for mode in ('normal','optimized'):
              text=(out/(mode+'.stderr')).read_text()
              if 'Ran 24 tests' not in text or 'FAILED' in text:
                  raise RuntimeError('unexpected finite-test coverage')
          report={'python':sys.version,'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],
                  'distinct_tests':24,'modes':['normal','optimized'],
                  'meaning':'finite algebra and counterexample checks; not analytic acceptance',
                  'files':{p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                           for p in root.iterdir() if p.is_file()}}
          (out/'REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          git diff --exit-code
      - name: Retain evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collision-mechanism-${{ github.run_id }}
          path: ${{ runner.temp }}/collision-mechanism
          if-no-files-found: error
          retention-days: 30
