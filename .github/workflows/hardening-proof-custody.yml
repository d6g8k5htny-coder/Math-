name: Hardening proof custody

'on':
  pull_request:
    paths:
      - 'imports/hardening_ebedb780/**'
      - '.gitattributes'
      - '.github/workflows/hardening-proof-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify exact imported bytes
        run: python -B -S imports/hardening_ebedb780/verify.py
