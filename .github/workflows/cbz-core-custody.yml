name: CBZ core custody verification
on:
  push:
    branches: [cbz/core-custody-native-20261029]
  pull_request:
    paths: ['formal/**', '.github/workflows/cbz-core-custody.yml']
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Real Git custody refusal controls
        env:
          MODE: ${{ matrix.mode }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          flags=()
          if [ "$MODE" = optimized ]; then flags+=(-O); fi
          python -B -S "${flags[@]}" -m unittest discover -s formal/tests -p test_source_custody.py -v 2>&1 | tee "$RUNNER_TEMP/custody-$MODE.log"
      - name: Retained complete formal Python suite
        env:
          MODE: ${{ matrix.mode }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          flags=()
          if [ "$MODE" = optimized ]; then flags+=(-O); fi
          python -B -S "${flags[@]}" -m unittest discover -s formal/tests -p "test_*.py" -v 2>&1 | tee "$RUNNER_TEMP/full-formal-$MODE.log"
      - name: Bound source preflight
        run: python -B -S formal/gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-custody-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/custody-*.log
            ${{ runner.temp }}/full-formal-*.log
          if-no-files-found: error
