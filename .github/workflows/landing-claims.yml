name: Landing claim manifest

'on':
  pull_request:
    paths:
      - 'README.md'
      - 'claims/LANDING_CLAIMS.json'
      - 'tools/landing_claims_check.py'
      - 'tests/test_landing_claims_check.py'
      - 'coefficients/side24_v1/**'
      - 'frontiers/three_fronts_20260924/**'
      - 'frontiers/remote_window_20260924/**'
      - 'frontiers/rn_thin_tube_20260925/**'
      - 'frontiers/price_budget_20260924/**'
      - 'frontiers/full_price_20260924/**'
      - 'frontiers/downstream_gate_20260925/**'
      - 'reviews/pr22_fixed_annulus_nonauthor_20260925/**'
      - 'reviews/replacement_20260925_pr19_pr21/**'
      - '.github/workflows/landing-claims.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  fail-closed-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Run landing-manifest negative controls
        run: |
          set -euo pipefail
          python -B -S -m unittest -v tests.test_landing_claims_check
          python -B -O -S -m unittest -v tests.test_landing_claims_check
      - name: Validate all advertised claims and live queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -S tools/landing_claims_check.py --verify-issues
