name: Intermediate height-window finite controls

'on':
  pull_request:
    paths:
      - 'frontiers/intermediate_window_20260928/**'
      - '.github/workflows/intermediate-window.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/intermediate_window_20260928/**'
      - '.github/workflows/intermediate-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-intermediate-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Exact sources, two modes, assertion-rejected mutations
        run: |
          set -euo pipefail
          python -B -S frontiers/intermediate_window_20260928/run_validation.py --output "${RUNNER_TEMP}/intermediate-window-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --exit-code
