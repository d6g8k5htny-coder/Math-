name: Intermediate height-window finite controls

'on':
  pull_request:
    paths:
      - 'frontiers/intermediate_window_20260928/**'
      - '.github/workflows/intermediate-window.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/intermediate_window_20260928/**'
      - '.github/workflows/intermediate-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-intermediate-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Exact sources, two modes, assertion-rejected mutations
        run: |
          set -euo pipefail
          python -B -S frontiers/intermediate_window_20260928/run_validation.py --output "${RUNNER_TEMP}/intermediate-window-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --exit-code
