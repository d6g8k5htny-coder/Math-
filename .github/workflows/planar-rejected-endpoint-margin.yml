name: Planar rejected-endpoint margin (A4) replay

'on':
  pull_request:
    paths:
      - 'frontiers/planar_rejected_endpoint_margin_20261003/**'
      - '.github/workflows/planar-rejected-endpoint-margin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a4-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify stored identities and replay the published author controls, both modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/planar_rejected_endpoint_margin_20261003/replay.py
          python -B -O -S frontiers/planar_rejected_endpoint_margin_20261003/replay.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
