name: QS d = 3 soft-layer chain (A3-A3.6) replay

'on':
  pull_request:
    paths:
      - 'frontiers/qs_d3_soft_layer_chain_20261005/**'
      - '.github/workflows/qs-d3-soft-layer-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: ['-B -S', '-B -O -S']
    name: replay (python ${{ matrix.mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify stored identities, extractions and replay the eight published author controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python ${{ matrix.mode }} frontiers/qs_d3_soft_layer_chain_20261005/replay.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
