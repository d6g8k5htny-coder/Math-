name: SIDE24 d=2 certified small-L coefficients (outward interval replay)

'on':
  pull_request:
    paths:
      - 'reviews/side24_d2_certified_small_L_claude_20261005/**'
      - '.github/workflows/side24-d2-certified.yml'
      - 'tests/test_certified_d2_workflow.py'
      - 'coefficients/side24_v1/coefficient.py'
      - 'coefficients/side24_v1/ENCLOSURE.json'
      - 'reviews/iba1_periodic_jet_claude_20261005/RESULTS.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-d2-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flags: ['-B -S', '-B -O -S']
    name: certified-d2-replay (${{ matrix.flags }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify the manifest and main pins, replay the checker, reject the mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path('reviews/side24_d2_certified_small_L_claude_20261005').resolve()
          meta = json.loads((root / 'SOURCE_FILES.json').read_text())
          present = sorted(p.name for p in root.iterdir())
          if present != sorted([e['path'] for e in meta['files']] + ['SOURCE_FILES.json']):
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          def blob(data):
              return hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
          for entry in meta['files'] + meta['pins_on_main']:
              path = pathlib.Path(entry['path']) if 'pins' in entry.get('kind', '') else root / entry['path']
              if path.is_symlink():
                  raise ValueError('regular file required: ' + entry['path'])
              data = path.read_bytes()
              if blob(data) != entry['git_blob']:
                  raise ValueError('git blob mismatch: ' + entry['path'])
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          flags = os.environ['FLAGS'].split()
          checker = str(root / 'certified_d2.py')
          run = subprocess.run([sys.executable] + flags + [checker], capture_output=True, cwd=root)
          if run.returncode != 0 or run.stdout != (root / 'RESULTS.json').read_bytes():
              raise ValueError('replay differs from RESULTS.json')
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate diagnostic key: ' + key)
                  result[key] = value
              return result
          expected_failures = (
              ('M1', 1, 'C4_strip_and_error_bound_L4'),
              ('M2', 1, 'C1_reference_equals_side24_closed_form'),
              ('M3', 1, 'C6_matches_iba1_diagnostic_L4'),
              ('M4', 1, 'C9_coarse_rule_consistent_L4'),
              ('M9', 2, None),
          )
          for label, code, failed_check in expected_failures:
              m = subprocess.run([sys.executable] + flags + [checker, '--mutant', label], capture_output=True, cwd=root)
              if m.returncode != code:
                  raise ValueError('mutant %s exited %d, expected %d' % (label, m.returncode, code))
              if m.stderr:
                  raise ValueError('mutant %s wrote unexpected stderr: %r' % (label, m.stderr))
              if failed_check is None:
                  if m.stdout.strip() != b'unknown mutant':
                      raise ValueError('unknown-label rejection has the wrong diagnostic: %r' % m.stdout)
              else:
                  diagnostic = json.loads(m.stdout, object_pairs_hook=unique_object)
                  if diagnostic != {'mutant': label, 'failed_check': failed_check}:
                      raise ValueError('mutant %s failed for the wrong reason: %r' % (label, diagnostic))
              print(json.dumps({'flags': flags, 'mutant': label, 'exit_code': m.returncode,
                                'failed_check': failed_check}, sort_keys=True))
          print('certified d=2 replay: manifest, pins, replay and mutants PASS')
          PY
      - name: Reject crashes and wrong-cause mutant diagnostics
        run: python ${{ matrix.flags }} -m unittest discover -s tests -p test_certified_d2_workflow.py -v
