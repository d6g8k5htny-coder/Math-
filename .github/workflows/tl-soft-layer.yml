name: Lifetime note TL replay

'on':
  pull_request:
    paths:
      - 'frontiers/tl_soft_layer_20261006/**'
      - 'tests/test_tl_soft_layer_replay_protocol.py'
      - 'tests/test_tl_soft_layer_replay_evidence.py'
      - '.github/workflows/tl-soft-layer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: ['-B -S', '-B -O -S']
    name: replay (python ${{ matrix.mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Verify protocol, stored identities, extractions and all published controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qs-replay-evidence"
          mkdir -p "$out/logs"
          python ${{ matrix.mode }} -m unittest discover -s tests -p test_tl_soft_layer_replay_protocol.py -v 2>&1 | tee "$out/logs/protocol.txt"
          python ${{ matrix.mode }} -m unittest discover -s tests -p test_tl_soft_layer_replay_evidence.py -v 2>&1 | tee "$out/logs/process-evidence-tests.txt"
          QS_REPLAY_EVIDENCE_DIR="$out/children" python ${{ matrix.mode }} frontiers/tl_soft_layer_20261006/replay.py 2>&1 | tee "$out/logs/replay.txt"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Preserve exact public sources and available execution logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qs-replay-evidence"
          mkdir -p "$out"
          cp -a frontiers/tl_soft_layer_20261006 "$out/packet"
          cp tests/test_tl_soft_layer_replay_protocol.py "$out/"
          cp tests/test_tl_soft_layer_replay_evidence.py "$out/"
          cp .github/workflows/tl-soft-layer.yml "$out/"
          git rev-parse HEAD > "$out/tested_commit.txt"
          printf '%s\n' '${{ matrix.mode }}' > "$out/mode.txt"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$out/run.txt"
      - name: Retain evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qs-replay-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qs-replay-evidence/
          if-no-files-found: error
