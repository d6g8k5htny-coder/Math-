name: Determinant moment (source checks and census observation; gate unqualified)

'on':
  pull_request:
    paths:
      - 'frontiers/determinant_moment_20261025/**'
      - 'tools/lean_packet_admission.py'
      - 'tests/test_lean_packet_admission.py'
      - 'tests/run_source_admission_mutations.py'
      - 'tests/test_source_admission_mutations.py'
      - '.github/workflows/determinant-moment-lean.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/determinant_moment_20261025/**'
      - 'tools/lean_packet_admission.py'
      - 'tests/test_lean_packet_admission.py'
      - 'tests/run_source_admission_mutations.py'
      - 'tests/test_source_admission_mutations.py'
      - '.github/workflows/determinant-moment-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: 2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Nonzero source admission and packet tests in both Python modes
        run: |
          set -euo pipefail
          for optimization in '' '-O'; do
            python -B $optimization -S - <<'PYCONTROLS'
          import unittest
          runner = unittest.TextTestRunner(verbosity=2)
          for directory, pattern in [('tests', 'test_lean_packet_admission.py'),
                                     ('tests', 'test_source_admission_mutations.py'),
                                     ('frontiers/determinant_moment_20261025/tests', 'test_*.py')]:
              suite = unittest.TestLoader().discover(directory, pattern=pattern)
              if suite.countTestCases() == 0:
                  raise SystemExit('zero tests discovered: ' + directory)
              if not runner.run(suite).wasSuccessful():
                  raise SystemExit(1)
          PYCONTROLS
          done
          python -B -S - <<'PYSOURCE'
          import runpy
          gate = runpy.run_path('frontiers/determinant_moment_20261025/gate.py')
          _, digest = gate['source_check']()
          print('SOURCE_ONLY_IDENTITY_PASS (no compiled or kernel qualification): ' + digest)
          PYSOURCE
      - name: Install pinned Lean and retrieve the Mathlib cache
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: frontiers/determinant_moment_20261025
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Observe real compiled census (unqualified; no acceptance receipt)
        run: |
          set -euo pipefail
          python -B -S - <<'PYOBSERVE'
          import hashlib
          import json
          import runpy
          import shutil
          gate = runpy.run_path('frontiers/determinant_moment_20261025/gate.py')
          gate['invalidate_active_receipt']()
          manifest, digest = gate['source_check']()
          root = gate['ROOT']
          helper = root / 'compiled_inventory.py'
          data = helper.read_bytes()
          gate['require'](not helper.is_symlink(), 'symlink compiled inventory helper')
          gate['require'](hashlib.sha256(data).hexdigest() == manifest['files']['compiled_inventory.py'],
                          'compiled inventory helper identity changed')
          compiled = {'__name__': 'compiled_census_observation', '__file__': str(helper)}
          exec(compile(data, str(helper), 'exec'), compiled)
          out = root / '.lake/formal-evidence'
          out.mkdir(parents=True, exist_ok=True)
          run = gate['run']
          gate['check_lean_version'](run(['lake', 'env', 'lean', '--version'], 'observation-version', out))
          gate['dependency_state'](manifest)
          build = root / '.lake/build'
          if build.exists():
              shutil.rmtree(build)
          run(['lake', 'build'], 'observation-build', out)
          run(['lake', 'env', 'leanchecker', 'ResearchFormalCoreR1'], 'observation-leanchecker', out)
          source = out / 'ObservedInventory.lean'
          source.write_text(compiled['inventory_source']())
          run(['lake', 'env', 'lean', str(source)], 'observation-inventory', out)
          _, after = gate['source_check']()
          gate['require'](after == digest, 'source identity changed during observation')
          (out / 'observation-status.json').write_text(json.dumps({
              'compiled_census_observation': 'EXECUTED', 'qualification': 'UNQUALIFIED',
              'acceptance': False, 'manifest_sha256': digest,
              'compiled_helper_sha256': hashlib.sha256(data).hexdigest()}, indent=2) + '\n')
          print('COMPILED_CENSUS_OBSERVED_UNQUALIFIED: raw output retained; no acceptance receipt')
          PYOBSERVE
      - name: Authoritative full gate (fails closed while compiled census is unqualified)
        run: |
          set -euo pipefail
          python -B -S frontiers/determinant_moment_20261025/gate.py --execute 2>&1 | tee frontiers/determinant_moment_20261025/.lake/formal-evidence/authoritative-gate.log
      - name: Tracked tree unchanged
        run: git diff --exit-code
      - name: Preserve raw observation and gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: determinant-moment-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontiers/determinant_moment_20261025/.lake/formal-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
