name: Downstream boundary review findings
'on':
  pull_request:
    paths: ['reviews/downstream_boundary_20260925/**', '.github/workflows/downstream-boundary-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: d6g8k5htny-coder/main
          ref: 044928047dc330724bd7829744d7898dee2cada5
          path: reviewed-main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/claims_gate_adapter.py
            /tools/semantic_digest.py
            /.github/workflows/ci.yml
            /claims/graph.json
            /architecture/scientific_state/v1/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Reproduce exact pin and actual adapter findings
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          pkg=reviews/downstream_boundary_20260925
          out="$RUNNER_TEMP/downstream-boundary-review"
          mkdir -p "$out"
          python -B -S -m unittest discover -s "$pkg" -p 'test_finite_pin_oracle.py' -v > "$out/pins-normal.stdout" 2> "$out/pins-normal.stderr"
          python -B -O -S -m unittest discover -s "$pkg" -p 'test_finite_pin_oracle.py' -v > "$out/pins-optimized.stdout" 2> "$out/pins-optimized.stderr"
          python -B -S "$pkg/finite_pin_oracle.py" > "$out/PIN_REPORT.json"
          python -B -S "$pkg/architecture_probes.py" --subject reviewed-main --output "$out/ARCHITECTURE_NORMAL.json" > "$out/architecture-normal.log"
          python -B -O -S "$pkg/architecture_probes.py" --subject reviewed-main --output "$out/ARCHITECTURE_OPTIMIZED.json" > "$out/architecture-optimized.log"
          git -C reviewed-main diff --exit-code
          git diff --exit-code
          echo 'FINDINGS_REPRODUCED: this is review evidence, NOT subject acceptance'
      - name: Retain review evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: downstream-boundary-review-${{ github.run_id }}
          path: ${{ runner.temp }}/downstream-boundary-review
          if-no-files-found: error
          retention-days: 30
