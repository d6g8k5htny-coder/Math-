name: C6 count-cap method-boundary controls

'on':
  pull_request:
    paths:
      - 'frontiers/c6_count_cap_boundary_20260929/**'
      - '.github/workflows/c6-count-cap-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/c6_count_cap_boundary_20260929/**'
      - '.github/workflows/c6-count-cap-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Exact sources and both-mode semantic controls
        run: |
          set -euo pipefail
          python -B -S frontiers/c6_count_cap_boundary_20260929/verify.py --output "${RUNNER_TEMP}/count-cap-boundary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --exit-code
