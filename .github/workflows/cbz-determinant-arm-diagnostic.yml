name: CBZ determinant ARM diagnostic
on:
  push:
    branches: [cbz/determinant-custody-arm-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custody-arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        optimize: ["normal", "optimized"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Execute unchanged real-Git and child-process controls
        env:
          CBZ_MODE: ${{ matrix.optimize }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$CBZ_MODE" = optimized ]; then flags=(-O); fi
          python -B -S "${flags[@]}" -m unittest discover -s cbz/verification/determinant_custody -p 'test_*.py' -v
  retained-components-arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        optimize: ["normal", "optimized"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Run retained component tests
        working-directory: frontiers/determinant_moment_20261025
        env:
          CBZ_MODE: ${{ matrix.optimize }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$CBZ_MODE" = optimized ]; then flags=(-O); fi
          python -B -S "${flags[@]}" -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run the twelve named source mutants
        working-directory: frontiers/determinant_moment_20261025
        env:
          CBZ_MODE: ${{ matrix.optimize }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$CBZ_MODE" = optimized ]; then flags=(-O); fi
          python -B -S "${flags[@]}" tests/run_cbz_mutations.py --output "$RUNNER_TEMP/determinant-mutants-$CBZ_MODE"
      - name: Preserve actual mutation records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: determinant-arm-mutations-${{ matrix.optimize }}-${{ github.run_id }}
          path: ${{ runner.temp }}/determinant-mutants-${{ matrix.optimize }}
          if-no-files-found: warn
