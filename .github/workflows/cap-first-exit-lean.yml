name: Cap first exit (Lean kernel evidence, no scientific promotion)

'on':
  pull_request:
    paths:
      - 'frontiers/cap_first_exit_lean_20261002/**'
      - '.github/workflows/cap-first-exit-lean.yml'
      - 'reviews/d1_cap_elder_partner_second_pass_claude_20260930/REVIEW.md'
      - 'imports/lifetime_parent_20260925/MARKED_CYLINDER_CAP_PROOF.md'
  push:
    branches: [main]
    paths:
      - 'frontiers/cap_first_exit_lean_20261002/**'
      - '.github/workflows/cap-first-exit-lean.yml'
      - 'reviews/d1_cap_elder_partner_second_pass_claude_20260930/REVIEW.md'
      - 'imports/lifetime_parent_20260925/MARKED_CYLINDER_CAP_PROOF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: 2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Source gate and unit tests in both Python modes (no Lean)
        run: |
          set -euo pipefail
          P=frontiers/cap_first_exit_lean_20261002
          python -B -S -m unittest discover -s "$P" -p 'test_*.py' -v
          python -B -O -S -m unittest discover -s "$P" -p 'test_*.py' -v
          python -B -S "$P/gate.py"
      - name: Install pinned Lean and retrieve the Mathlib cache
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: frontiers/cap_first_exit_lean_20261002
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Auditor self-test with actual pinned Lean (both Python modes)
        working-directory: frontiers/cap_first_exit_lean_20261002
        run: |
          set -euo pipefail
          LEAN_EXECUTABLE="$(lake env which lean)"
          test -n "$LEAN_EXECUTABLE"
          test -x "$LEAN_EXECUTABLE"
          test ! -e .lake/auditor-selftest
          python -B -S run_cbz_mutations.py --lean "$LEAN_EXECUTABLE" --output .lake/auditor-selftest
      - name: Fresh build, leanchecker replay, axiom audit, negative controls
        run: python -B -S frontiers/cap_first_exit_lean_20261002/gate.py --execute
      - name: Tracked tree unchanged
        run: git diff --exit-code
      - name: Preserve logs and receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cap-first-exit-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontiers/cap_first_exit_lean_20261002/.lake/evidence/
            frontiers/cap_first_exit_lean_20261002/.lake/auditor-selftest/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
