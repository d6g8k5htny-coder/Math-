name: Three mathematical fronts exact replay
'on':
  push:
    branches: [chatgpt/three-fronts-20260924]
  pull_request:
    paths: ['frontiers/three_fronts_20260924/**', '.github/workflows/three-fronts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact sources and run both modes plus deliberate mutations
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -S - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path('frontiers/three_fronts_20260924').resolve()
          pins=json.loads((root/'SOURCE_FILES.json').read_text())
          def verify():
              for name,identity in pins['files'].items():
                  if pathlib.PurePosixPath(name).name!=name:
                      raise ValueError('flat source path required')
                  path=root/name
                  if path.is_symlink():
                      raise ValueError('source symlink refused')
                  raw=path.read_bytes()
                  if len(raw)!=identity['bytes'] or hashlib.sha256(raw).hexdigest()!=identity['sha256']:
                      raise ValueError('source identity mismatch: '+name)
          if sys.version_info[:2]!=(3,11):
              raise RuntimeError('actual Python3.11 required')
          verify()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'three-fronts-results'
          subprocess.run([sys.executable,'-B','-S',str(root/'run_validation.py'),'--output',str(out)],check=True,timeout=240)
          verify()
          for mode,flags in [('normal',[]),('optimized',['-O'])]:
              price=subprocess.run([sys.executable,'-B',*flags,'-S','-m','unittest','-v','test_price_boundary'],cwd=root,capture_output=True,text=True,timeout=30)
              (out/('price_'+mode+'.stdout')).write_text(price.stdout)
              (out/('price_'+mode+'.stderr')).write_text(price.stderr)
              if price.returncode or 'Ran 3 tests' not in price.stderr or 'skipped=' in price.stderr:
                  raise RuntimeError('price boundary controls failed')
          verify()
          report=json.loads((out/'REPORT.json').read_text())
          if not report['passed'] or report['distinct_tests']!=54 or report['distinct_semantic_mutations']!=10:
              raise RuntimeError('unexpected result')
          (out/'GITHUB_CONTEXT.json').write_text(json.dumps({'sha':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'python':sys.version,'source_files_verified':len(pins['files']),'distinct_price_tests':3,'total_distinct_tests':57,'meaning':'same-author cross-runtime checks, not nonauthor analytic review'},indent=2)+'\n')
          print('THREE_FRONTS_PASSED='+json.dumps(report,sort_keys=True))
          PY
      - name: Preserve actual logs including any failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: three-fronts-${{ github.run_id }}
          path: ${{ runner.temp }}/three-fronts-results
          if-no-files-found: error
          retention-days: 30
