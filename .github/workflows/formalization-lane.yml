name: Formal verification lane (Layer 1)
'on':
  pull_request:
    paths:
      - 'formalization/**'
      - 'claims/LANDING_CLAIMS.json'
      - 'frontiers/downstream_gate_20260925/GRAPH.json'
      - 'frontiers/downstream_gate_20260925/hard_gate.py'
      - 'formal/lean-toolchain'
      - 'formal/lakefile.toml'
      - 'formal/lake-manifest.json'
      - 'formal/manifest.json'
      - '.github/workflows/formalization-lane.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    name: formal-registry-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Negative controls and registry validation in both Python modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s formalization -p 'test_*.py' -v
          python -B -O -S -m unittest discover -s formalization -p 'test_*.py' -v
          python -B -S formalization/formal_gate.py --output "$RUNNER_TEMP/formal-registry-report.json"
      - name: Retain report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formal-registry-${{ github.run_id }}
          path: ${{ runner.temp }}/formal-registry-report.json
          if-no-files-found: error
          retention-days: 30

  lean-core:
    name: lean-kernel-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      # Kernel check plus the bundled `leanchecker` (independent re-check of the
      # compiled environment) and the axiom audit (propext, Classical.choice,
      # Quot.sound only). `nanoda` is off: lean-action v1.6.0 clones unpinned
      # lean4export master and the nanoda_lib `debug` branch, which are mutable and
      # currently incompatible ("invalid digit found in string" on the 4.34.1
      # export). Re-enable only through a pinned lean4export/nanoda pair.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: formalization/lean/core
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'true'
          nanoda: 'false'
          axiom-audit: 'true'
          axiom-audit-allow: 'propext,Classical.choice,Quot.sound'
          axiom-audit-root: 'MathFormalCore'
      - name: Replay axiom audit against the pinned AXIOMS.expected
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python -B -S formalization/formal_gate.py --with-lean --package core --no-results-check --output "$RUNNER_TEMP/formal-core-report.json"
      - name: Retain report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formal-lean-core-${{ github.run_id }}
          path: ${{ runner.temp }}/formal-core-report.json
          if-no-files-found: error
          retention-days: 30

  lean-mathlib:
    name: lean-kernel-mathlib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: formalization/lean/mathlib
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          axiom-audit: 'true'
          axiom-audit-allow: 'propext,Classical.choice,Quot.sound'
          axiom-audit-root: 'MathFormalReal'
      - name: Replay axiom audit against the pinned AXIOMS.expected
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python -B -S formalization/formal_gate.py --with-lean --package mathlib --no-results-check --output "$RUNNER_TEMP/formal-mathlib-report.json"
      - name: Retain report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formal-lean-mathlib-${{ github.run_id }}
          path: ${{ runner.temp }}/formal-mathlib-report.json
          if-no-files-found: error
          retention-days: 30
