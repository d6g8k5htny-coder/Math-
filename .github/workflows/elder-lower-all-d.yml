name: Elder-failure lower bound (every d) checks

'on':
  pull_request:
    paths:
      - 'frontiers/elder_lower_all_d_20260929/**'
      - '.github/workflows/elder-lower-all-d.yml'
      - 'tests/test_elder_lower_all_d_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Verify sources, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/elder_lower_all_d_20260929').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          script = str(root / 'lower_all_d_check.py')
          expected = (root / 'RESULTS.json').read_bytes()
          mutants = ['M1', 'M2', 'M3']
          expected_failures = {
              'M1': b'FAIL L_ledger_m2\n',
              'M2': b'FAIL P2_hessian_M\n',
              'M3': b'FAIL E6_margin_below\n',
          }
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script],
                                   check=True, capture_output=True, timeout=300)
              if out.stdout != expected:
                  raise RuntimeError('output differs from RESULTS.json under ' + ' '.join(flags))
              if out.stderr:
                  raise RuntimeError('baseline stderr under ' + ' '.join(flags))
              for m in mutants:
                  out = subprocess.run([sys.executable, *flags, script, '--mutant', m],
                                       capture_output=True, timeout=300)
                  if out.returncode != 1 or out.stdout != expected_failures[m] or out.stderr:
                      raise RuntimeError('mutant ' + m + ' not rejected with expected failure')
          print(json.dumps({'scientific_effect': 'NONE', 'scientific_acceptance': False}))
          PY
          git diff --exit-code
      - name: Full-shell protocol regression tests in both modes
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s tests -p 'test_elder_lower_all_d_workflow.py' -v
          python -B -O -S -m unittest discover -s tests -p 'test_elder_lower_all_d_workflow.py' -v
