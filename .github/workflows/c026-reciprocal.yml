name: C026 finite-polynomial reciprocal
'on':
  pull_request:
    paths:
      - 'repairs/c026_reciprocal_20260927/**'
      - '.github/workflows/c026-reciprocal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: c026-reciprocal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Check exact finite-polynomial contract in both Python modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s repairs/c026_reciprocal_20260927 -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/c026-normal.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/c026-normal.log" || { echo "::error::C026 normal discovery collected 0 tests or returned no count"; exit 1; }
          python -B -O -S -m unittest discover -s repairs/c026_reciprocal_20260927 -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/c026-optimized.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/c026-optimized.log" || { echo "::error::C026 optimized discovery collected 0 tests or returned no count"; exit 1; }
