name: CBZ determinant source custody controls
on:
  push:
    branches: [cbz/determinant-custody-red-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custody:
    strategy:
      fail-fast: false
      matrix:
        optimize: ["normal", "optimized"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Execute all real-Git custody controls
        env:
          CBZ_MODE: ${{ matrix.optimize }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$CBZ_MODE" = optimized ]; then flags=(-O); fi
          python -B -S "${flags[@]}" -m unittest discover -s cbz/verification/determinant_custody -p 'test_*.py' -v
  retained-components:
    strategy:
      fail-fast: false
      matrix:
        optimize: ["normal", "optimized"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Execute the retained complete component suite
        working-directory: frontiers/determinant_moment_20261025
        env:
          CBZ_MODE: ${{ matrix.optimize }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$CBZ_MODE" = optimized ]; then flags=(-O); fi
          python -B -S "${flags[@]}" -m unittest discover -s tests -p 'test_*.py' -v
