name: P15 tail and weighted-load exact controls

'on':
  pull_request:
    paths:
      - 'frontiers/p15_tail_load_20260928/**'
      - '.github/workflows/p15-tail-load.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/p15_tail_load_20260928/**'
      - '.github/workflows/p15-tail-load.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-tail-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Exact sources, both Python modes and seven semantic mutants
        run: |
          set -euo pipefail
          python -B -S frontiers/p15_tail_load_20260928/verify.py --output "${RUNNER_TEMP}/tail-load-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --exit-code
