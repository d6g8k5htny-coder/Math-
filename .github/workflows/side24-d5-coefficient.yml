name: SIDE24 d5 coefficient

'on':
  pull_request:
    paths:
      - 'coefficients/side24_d5_20260930/**'
      - '.github/workflows/side24-d5-coefficient.yml'
      - 'tools/**'
      - 'tools.py'
      - 'tests/test_side24_mutant_workflows.py'
      - 'tests/test_legacy_workflow_triggers.py'
      - 'imports/lifetime_parent_20260925/UNIFORM_MATRIX_CAP_AND_LIFETIME.md'
      - 'coefficients/side24_v1/PROOF.md'
      - 'coefficients/side24_v1/ENCLOSURE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-and-reject-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Check trigger coverage and the SIDE24 replay contract in both modes
        env:
          SIDE24_MUTANT_TEST_FAMILY: 'side24-d5-coefficient'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -S tests/test_side24_mutant_workflows.py
          python -B -O -S tests/test_side24_mutant_workflows.py
      - name: Verify sources and pins, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('coefficients/side24_d5_20260930').resolve()
          manifest_doc = json.loads((root / 'SOURCE_FILES.json').read_text())
          manifest = manifest_doc['files']
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          for pin in manifest_doc['pins_on_main']:
              if not pin.get('workflow_checked'):
                  continue
              p = pathlib.Path(pin['path'])
              if p.is_symlink() or not p.is_file():
                  raise ValueError('pinned source missing: ' + pin['path'])
              data = p.read_bytes()
              blob = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
              if blob != pin['git_blob']:
                  raise ValueError('pinned source drifted: ' + pin['path'] + ' ' + blob)
          # the SIDE24 d = 2, 3 enclosures quoted inside the script must be the ones on main
          enc = json.loads(pathlib.Path('coefficients/side24_v1/ENCLOSURE.json').read_text())['dimensions']
          src = (root / 'cone_moment_d5.py').read_text()
          for d in ('2', '3'):
              if ('"%s", "%s"' % (enc[d]['lower'], enc[d]['upper'])) not in src:
                  raise ValueError('SIDE24 d = ' + d + ' enclosure quoted in the script differs from ENCLOSURE.json')
          expected = (root / 'RESULTS.json').read_bytes()
          doc = json.loads(expected)
          if not (doc['passed'] and len(doc['checks']) == 13 and all(doc['checks'].values())):
              raise RuntimeError('RESULTS.json is not a passing certification')
          # Every child: exact exit status, one timing line on stderr, baseline stdout equal
          # to RESULTS.json, each mutant's report equal to the measured one (both modes).
          from tools.side24_mutant_replay import replay
          replay('side24-d5-coefficient', pathlib.Path.cwd(), timeout=1500)
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False, 'certified_enclosures': True, 'side24_v1': 'unchanged'}))
          PY
          git diff --exit-code
