name: Pin microdisk covariance exact checks

'on':
  pull_request:
    paths:
      - 'reviews/pin_micro_covariance_20260926/**'
      - '.github/workflows/pin-micro-covariance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Run exact rational check in both modes
        run: |
          set -euo pipefail
          python -B -S reviews/pin_micro_covariance_20260926/exact_check.py
          python -B -O -S reviews/pin_micro_covariance_20260926/exact_check.py
          git diff --exit-code
