name: Pin microdisk covariance exact checks

'on':
  pull_request:
    paths:
      - 'reviews/pin_micro_covariance_20260926/**'
      - '.github/workflows/pin-micro-covariance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Run exact rational check in both modes
        run: |
          set -euo pipefail
          python -B -S reviews/pin_micro_covariance_20260926/exact_check.py
          python -B -O -S reviews/pin_micro_covariance_20260926/exact_check.py
          git diff --exit-code
