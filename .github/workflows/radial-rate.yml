name: Microscopic radial-rate checks

'on':
  pull_request:
    paths:
      - 'frontiers/radial_rate_20260930/**'
      - '.github/workflows/radial-rate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Fetch exact public source objects
        run: |
          set -euo pipefail
          git fetch --no-tags origin 80059a97cd8eb32d1a17a0ad9cb22cb2a0d7b337
          git fetch --no-tags origin 382c0f9ff2281f43651ddbdf2e9b36dd52e2c6bf
          git fetch --no-tags origin 7a1cb09a9d58d179393e6d29146252f714b9c9bf
      - name: Verify sources, packet and both Python modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/radial_rate_20260930/verify.py
          git diff --exit-code
