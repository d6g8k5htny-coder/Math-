name: Literature addendum d = 1 Rice check

'on':
  pull_request:
    paths:
      - 'reviews/literature_classical_neighbors_20261001/**'
      - '.github/workflows/literature-classical-neighbors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify packet, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('reviews/literature_classical_neighbors_20261001').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest['files']] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest['files']:
              path = root / entry['path']
              if path.is_symlink():
                  raise ValueError('symlink: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('packet file identity mismatch: ' + entry['path'])
          script = str(root / 'd1_rice_check.py')
          expected = (root / 'D1_RICE.json').read_bytes()
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script], check=True, capture_output=True, timeout=600).stdout
              if out != expected:
                  raise RuntimeError('output differs from D1_RICE.json under ' + ' '.join(flags))
              for m in manifest['mutants']:
                  rc = subprocess.run([sys.executable, *flags, script, '--mutant', m], capture_output=True, timeout=600).returncode
                  if rc != 1:
                      raise RuntimeError('mutant ' + m + ' not rejected')
              rc = subprocess.run([sys.executable, *flags, script, '--mutant', 'M9'], capture_output=True, timeout=600).returncode
              if rc != 2:
                  raise RuntimeError('unknown mutant label not rejected with exit 2')
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
