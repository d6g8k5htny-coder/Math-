name: C296 regular-point chart

on:
  pull_request:
    paths:
      - "frontiers/regular_point_chart_20261020/**"
      - ".github/workflows/c296-regular-point-chart.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
          lake-package-directory: frontiers/regular_point_chart_20261020
      - name: Build the exact C296 interface
        working-directory: frontiers/regular_point_chart_20261020
        run: |
          set -euo pipefail
          lean --version
          lake build RegularPointChartInterface
