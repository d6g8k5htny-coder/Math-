name: SARD-G fixed-frame and closure finite controls
'on':
  pull_request:
    paths:
      - 'frontiers/sard_g_a2_parameter_20260929/**'
      - '.github/workflows/sard-g-a2-fixed-frame.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/sard_g_a2_parameter_20260929/**'
      - '.github/workflows/sard-g-a2-fixed-frame.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-fixed-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Exact successor sources and intended semantic failures in both modes
        run: |
          set -euo pipefail
          python -B -S frontiers/sard_g_a2_parameter_20260929/v2/verify.py --output "${RUNNER_TEMP}/sard-fixed-frame-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --exit-code
