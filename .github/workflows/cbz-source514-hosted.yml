name: CBZ source514 frozen kernel qualification
'on':
  pull_request:
    paths:
      - '.github/workflows/cbz-source514-hosted.yml'
      - 'tools/cbz_source514_hosted.py'
      - 'tools/cbz_source514_mutations.py'
      - 'tests/test_cbz_source514_hosted.py'
      - 'cbz/source514-hosted/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cbz-source514-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source514-frozen-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Read retained raw RED streams from the original native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/d6g8k5htny-coder/Math-/actions/artifacts/12929346355/zip > "$RUNNER_TEMP/source514-original-census-red.zip"
          gh api repos/d6g8k5htny-coder/Math-/actions/artifacts/12928801439/zip > "$RUNNER_TEMP/source514-original-recorder-red.zip"
          python - "$RUNNER_TEMP/source514-original-census-red.zip" "$RUNNER_TEMP/source514-original-recorder-red.zip" <<'PY'
          import hashlib,sys,zipfile
          expected=['e4602537b4b8e8929a63fb2ca316f4a5b4c10b9606d1dd54379511b54f81e586','6b655de27b769e1968a36d40e87ee376730efe778cd77068a4fdfd3321231a37']
          for filename,wanted in zip(sys.argv[1:],expected):
              data=open(filename,'rb').read()
              if hashlib.sha256(data).hexdigest()!=wanted:
                  raise ValueError('original RED artifact digest differs')
              with zipfile.ZipFile(filename) as archive:
                  for item in archive.infolist():
                      if item.filename.endswith(('independent-compiled-census.stdout','independent-compiled-census.stderr','normal-baseline.stderr')):
                          if item.file_size>1048576:
                              raise ValueError('unexpected diagnostic stream size')
                          print('RETAINED_ORIGINAL_RED_STREAM',item.filename)
                          print(archive.read(item).decode('utf-8'))
          PY
      - name: Verify recorder contracts and all six reason-bound source mutations
        run: |
          python -B -S tools/cbz_source514_mutations.py --output "$RUNNER_TEMP/cbz-source514-recorder-tests"
      - name: Obtain immutable mathematical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: d6g8k5htny-coder/Math-
          ref: 86c00d4c08c6c2af0529ec1744693de3ca6ac6e4
          path: candidate
          persist-credentials: false
      - name: Obtain already-qualified replay tool and its complete self-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: d6g8k5htny-coder/main
          ref: 66c54f8c161c3af467e5d1d715066c96b3a0561b
          path: replay
          sparse-checkout: cbz/evidence/kernel/additional/replay-tool
          persist-credentials: false
      - name: Obtain immutable collector and established phase recorder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: d6g8k5htny-coder/Math-
          ref: 8151f592918a845bf19eb8eafaf8444540a32734
          path: collector
          sparse-checkout: |
            formal
            frontiers/regular_superlevel_geometry_20261020
          persist-credentials: false
      - name: Verify original Python replay reader and its source mutations
        run: |
          python -B -S replay/cbz/evidence/kernel/additional/replay-tool/run_mutations.py --output "$RUNNER_TEMP/cbz-source514-replay-python-tests"
      - name: Install exact Lean and pinned Mathlib dependency cache
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: candidate/frontiers/source_derivative_gaussian_20261025
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Actual Lean adverse fixtures and all six generated-auditor mutants in both modes
        run: |
          cd candidate/frontiers/source_derivative_gaussian_20261025
          LEAN_BIN="$(lake env which lean)"
          cd "$GITHUB_WORKSPACE"
          python -B -S replay/cbz/evidence/kernel/additional/replay-tool/run_lean_selftest.py --lean "$LEAN_BIN" --collector collector/formal/gate_helper.py --collector-sha256 ff8a5374597772b2d37054fd722c2243c4b552a63802c69f7c605519832be6c4 --output "$RUNNER_TEMP/cbz-source514-lean-selftest-normal"
          python -B -S -O replay/cbz/evidence/kernel/additional/replay-tool/run_lean_selftest.py --lean "$LEAN_BIN" --collector collector/formal/gate_helper.py --collector-sha256 ff8a5374597772b2d37054fd722c2243c4b552a63802c69f7c605519832be6c4 --output "$RUNNER_TEMP/cbz-source514-lean-selftest-optimized"
      - name: Build exact 99 modules and replay complete owned proof closure into an empty kernel
        run: |
          python -B -S tools/cbz_source514_hosted.py --source candidate --replay replay --collector collector --plan cbz/source514-hosted/domain.json --output "$RUNNER_TEMP/cbz-source514-observation" --carrier . --carrier-head "${{ github.sha }}"
      - name: Preserve every raw result and source, including unsuccessful attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbz-source514-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cbz-source514-*
            candidate/frontiers/source_derivative_gaussian_20261025/*.lean
            candidate/frontiers/source_derivative_gaussian_20261025/inputs/**/*.lean
            candidate/frontiers/source_derivative_gaussian_20261025/lakefile.toml
            candidate/frontiers/source_derivative_gaussian_20261025/lake-manifest.json
            candidate/frontiers/source_derivative_gaussian_20261025/lean-toolchain
            cbz/source514-hosted/domain.json
            tools/cbz_source514_hosted.py
            tools/cbz_source514_mutations.py
            tests/test_cbz_source514_hosted.py
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
