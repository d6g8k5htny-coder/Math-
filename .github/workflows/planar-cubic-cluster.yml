name: Planar cubic cluster checks

'on':
  pull_request:
    paths:
      - 'frontiers/planar_cubic_cluster_20260929/**'
      - '.github/workflows/planar-cubic-cluster.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify packet, both sources and both Python modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/planar_cubic_cluster_20260929/verify.py
          git diff --exit-code
