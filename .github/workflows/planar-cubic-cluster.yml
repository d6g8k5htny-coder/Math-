name: Planar cubic cluster checks

'on':
  pull_request:
    paths:
      - 'frontiers/planar_cubic_cluster_20260929/**'
      - '.github/workflows/planar-cubic-cluster.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Verify packet, both sources and both Python modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/planar_cubic_cluster_20260929/verify.py
          git diff --exit-code
