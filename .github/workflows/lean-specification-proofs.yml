name: Lean statement proofs (kernel evidence about registered Props only, no scientific promotion)

'on':
  pull_request:
    paths:
      - 'specifications/lean_statement_proofs_20261011/**'
      - 'specifications/lean_statements_20261010/**'
      - '.github/workflows/lean-specification-proofs.yml'
  push:
    branches: [main]
    paths:
      - 'specifications/lean_statement_proofs_20261011/**'
      - 'specifications/lean_statements_20261010/**'
      - '.github/workflows/lean-specification-proofs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Unit tests in both Python modes and the source check (no Lean)
        run: |
          set -euo pipefail
          P=specifications/lean_statement_proofs_20261011
          python -B -S "$P/test_check.py"
          python -B -O -S "$P/test_check.py"
          python -B -S "$P/check.py"
      - name: Install pinned Lean and retrieve the Mathlib cache
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: specifications/lean_statement_proofs_20261011
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Lean-driving unit tests on dependency-free fixture packages (environment audit, its controls, the escapes it must refuse)
        run: python -B -S specifications/lean_statement_proofs_20261011/test_check.py LeanHelpers
      - name: "Exact Lean version, fresh build (statement packet from source, then the proof modules), leanchecker, #check and #print axioms of every inventoried theorem, environment audit, negative controls, receipt"
        run: python -B -S specifications/lean_statement_proofs_20261011/check.py --execute
      - name: Tracked tree unchanged
        run: git diff --exit-code
      - name: Preserve logs and receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lean-specification-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          path: specifications/lean_statement_proofs_20261011/.lake/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
