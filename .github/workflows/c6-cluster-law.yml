name: C6 cluster-law checks

'on':
  pull_request:
    paths:
      - 'frontiers/c6_cluster_law_20260929/**'
      - '.github/workflows/c6-cluster-law.yml'
      - 'tools/legacy_json_replay.py'
      - 'tools/legacy_json_contracts.json'
      - 'tests/test_legacy_json_workflows.py'
      - 'tools/**'
      - 'tools.py'
      - 'tests/test_legacy_workflow_triggers.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Check legacy import-resolution trigger coverage
        run: |
          python -B -S tests/test_legacy_workflow_triggers.py
          python -B -O -S tests/test_legacy_workflow_triggers.py
      - name: Exercise the complete shell rejection contract in both modes
        env:
          LEGACY_TEST_FAMILY: 'c6-cluster'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -S tests/test_legacy_json_workflows.py
          python -B -O -S tests/test_legacy_json_workflows.py
      - name: Verify sources, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/c6_cluster_law_20260929').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          pins = json.loads((root / 'SOURCE_MAP.json').read_text())
          for entry in pins['inputs'] + pins['planar_sources_behind_DL']:
              data = pathlib.Path(entry['path']).read_bytes()
              blob = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or blob != entry['git_blob']:
                  raise ValueError('consumed source identity mismatch on this tree: ' + entry['path'])
          from tools.legacy_json_replay import replay
          replay('c6-cluster', root)
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
