name: Cap I4 isolated matrix cone identification
on:
  push:
    branches: ['chatgpt/cap-i4-matrix-formal-20261006']
    paths:
      - 'companions/cap_i4_matrix_20261006/**'
      - '.github/workflows/cap-i4-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: formal
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Compile exact parent and matrix contracts with fresh kernel evidence
        run: bash companions/cap_i4_matrix_20261006/replay.sh
      - name: Preserve actual evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cap-i4-matrix-${{ github.sha }}
          path: .lake/cap-i4-matrix/
          include-hidden-files: true
          if-no-files-found: warn
