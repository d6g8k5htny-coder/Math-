name: Local cluster tightness and conditional closure controls

'on':
  pull_request:
    paths:
      - 'frontiers/local_cluster_tightness_20260929/**'
      - '.github/workflows/local-cluster-tightness.yml'
      - 'frontiers/c6_palm_route_20260929/PROOF.md'
      - 'frontiers/d5_dimension_lift_20260929/PROOF.md'
      - 'frontiers/remote_window_20260924/PROOF.md'
      - 'frontiers/remote_collision_20260928/PROOF.md'
      - 'frontiers/window_multiplicity_laws_20260928/LOCAL_MULTIPLICITY.md'
      - 'frontiers/c6_rare_cluster_laws_20260929/PROOF.md'
  push:
    branches: [main]
    paths:
      - 'frontiers/local_cluster_tightness_20260929/**'
      - '.github/workflows/local-cluster-tightness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-tightness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Both modes, semantic controls and exact current/historical sources
        run: |
          set -euo pipefail
          python -B -S frontiers/local_cluster_tightness_20260929/verify.py --repo "${GITHUB_WORKSPACE}" --output "${RUNNER_TEMP}/tightness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --exit-code
