name: C6 rare-cluster consequence checks

'on':
  pull_request:
    paths:
      - 'frontiers/c6_rare_cluster_laws_20260929/**'
      - '.github/workflows/c6-rare-cluster-laws.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Fetch immutable public premise object
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 78ac1100217279e7b692f0959f86eee34cd1910e
      - name: Verify identities, both Python modes and negative controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/c6_rare_cluster_laws_20260929/verify_packet.py
          git diff --exit-code
