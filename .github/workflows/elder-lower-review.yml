name: D1 elder lower-bound nonauthor review checks

'on':
  pull_request:
    paths:
      - 'reviews/d1_elder_lower_claude_20260928/**'
      - '.github/workflows/elder-lower-review.yml'
      - 'tests/test_elder_lower_review_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.16'
      - name: Verify sources, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import argparse, contextlib, copy, hashlib, io, json, pathlib, subprocess, sys
          root = pathlib.Path('reviews/d1_elder_lower_claude_20260928').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          script = str(root / 'elder_lower_exact_check.py')
          expected = (root / 'RESULTS.json').read_bytes()
          mutants = ['drop-aZ-over-8', 'hessian-sign', 'path-endpoint',
                     'weight-power', 'tv-half']
          mutant_false = {
              'drop-aZ-over-8': (
                  ('NF_pinned_normal_form', 'F_minus_P_is_O_r_generic_degree6'),
                  ('NF_pinned_normal_form', 'P_satisfies_all_six_pins_for_arbitrary_jets'),
              ),
              'hessian-sign': (
                  ('G_cubic_critical_data', 'M_hessian_diag_-6k_-k_over_2_max'),
              ),
              'path-endpoint': (
                  ('PATH_elder_obstruction', 'g3_prime_ge_9_over_64'),
                  ('PATH_elder_obstruction', 'path_end_17_over_64'),
                  ('PATH_elder_obstruction', 'path_in_B3'),
                  ('PATH_elder_obstruction', 'segment_polynomials_E6'),
              ),
              'weight-power': (
                  ('LED_ledgers', 'tilt_ledger_r_times_r4_over_r2_is_r3'),
              ),
              'tv-half': (
                  ('TV_multiplicity', 'bernoulli_tv_equals_h_random_exact'),
              ),
          }
          unknown_stream = io.StringIO()
          unknown_parser = argparse.ArgumentParser(prog=pathlib.Path(script).name)
          unknown_parser.add_argument('--mutant', choices=tuple(mutants))
          with contextlib.redirect_stderr(unknown_stream):
              try:
                  unknown_parser.parse_args(['--mutant', 'M99'])
              except SystemExit as exc:
                  if exc.code != 2:
                      raise RuntimeError('independent unknown-label parser did not exit 2')
              else:
                  raise RuntimeError('independent unknown-label parser accepted M99')
          unknown_stderr = unknown_stream.getvalue().encode()
          baseline = json.loads(expected)
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script],
                                   capture_output=True, timeout=300)
              if out.returncode != 0:
                  raise RuntimeError('baseline exit differs from 0 under ' + ' '.join(flags))
              if out.stdout != expected:
                  raise RuntimeError('output differs from RESULTS.json under ' + ' '.join(flags))
              if out.stderr:
                  raise RuntimeError('baseline stderr under ' + ' '.join(flags))
              for m in mutants:
                  wanted = copy.deepcopy(baseline)
                  wanted['passed'] = False
                  for group, check in mutant_false[m]:
                      wanted['checks'][group][check] = False
                  report = (json.dumps(wanted, indent=2, sort_keys=True) + '\n').encode()
                  out = subprocess.run([sys.executable, *flags, script, '--mutant', m],
                                       capture_output=True, timeout=300)
                  if out.returncode != 1 or out.stdout != report or out.stderr:
                      raise RuntimeError('mutant ' + m + ' not rejected with exact report')
              out = subprocess.run([sys.executable, *flags, script, '--mutant', 'M99'],
                                   capture_output=True, timeout=300)
              if out.returncode != 2 or out.stdout or out.stderr != unknown_stderr:
                  raise RuntimeError('unknown mutant label not rejected with exact protocol')
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
      - name: Full-shell protocol regression tests in both modes
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s tests -p 'test_elder_lower_review_workflow.py' -v
          python -B -O -S -m unittest discover -s tests -p 'test_elder_lower_review_workflow.py' -v
