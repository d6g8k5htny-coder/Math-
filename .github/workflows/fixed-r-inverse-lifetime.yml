name: Fixed-r inverse-lifetime checks

'on':
  pull_request:
    paths:
      - 'frontiers/fixed_r_inverse_lifetime_20260930/**'
      - '.github/workflows/fixed-r-inverse-lifetime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Fetch exact public parent model
        run: |
          set -euo pipefail
          git fetch --no-tags origin 7a1cb09a9d58d179393e6d29146252f714b9c9bf
      - name: Verify source, packet and both Python modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/fixed_r_inverse_lifetime_20260930/verify.py
          git diff --exit-code
