# UNSELECTED UNOPENED source draft. Publication requires distinct external pre-exec admission.
name: Conditional quotient closed-superlevel adapter hosted development R2
'on':
  push:
    branches: [codex/quotient-closed-superlevel-lpc-adapter-20261020-r2]
    paths:
      - 'frontiers/quotient_closed_superlevel_lpc_adapter_20261020/**'
      - '.github/workflows/quotient-closed-superlevel-lpc-adapter.yml'
permissions:
  contents: read
concurrency:
  group: quotient-closed-superlevel-lpc-adapter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  adapter-hosted-development:
    if: ${{ github.run_attempt == 1 && github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      QUO_MANIFEST_SHA256: '08bf4c5da9489ff84fb9203a37cc70a923ba6b1153a42da78abf128ee85c1acf'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Source custody and inert collector controls before Lean
        timeout-minutes: 4
        run: |
          python3 -B -S frontiers/quotient_closed_superlevel_lpc_adapter_20261020/quo_hosted_verify.py source --manifest-sha256 "$QUO_MANIFEST_SHA256"
          python3 -B -S -m unittest discover -s frontiers/quotient_closed_superlevel_lpc_adapter_20261020 -p test_quo_hosted_verify.py -v
          python3 -B -O -S -m unittest discover -s frontiers/quotient_closed_superlevel_lpc_adapter_20261020 -p test_quo_hosted_verify.py -v
      - name: Explicit bounded pinned setup and cache bootstrap
        timeout-minutes: 15
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: formal
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Serial exact-source development collection with held final predicates
        timeout-minutes: 65
        run: |
          cd formal
          lake env python3 -B -S ../frontiers/quotient_closed_superlevel_lpc_adapter_20261020/quo_hosted_verify.py execute --manifest-sha256 "$QUO_MANIFEST_SHA256"
      - name: Preserve sources objects raw streams and terminal receipts
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quotient-closed-superlevel-lpc-adapter-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/quo-closed-superlevel-hosted-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
