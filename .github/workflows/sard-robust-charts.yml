name: SARD robust-chart exact interface controls

'on':
  pull_request:
    paths:
      - 'frontiers/sard_g_robust_charts_20260929/**'
      - '.github/workflows/sard-robust-charts.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/sard_g_robust_charts_20260929/**'
      - '.github/workflows/sard-robust-charts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robust-chart-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Exact packet and both-mode geometric negatives
        run: |
          set -euo pipefail
          python -B -S frontiers/sard_g_robust_charts_20260929/verify.py --output "${RUNNER_TEMP}/sard-robust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --exit-code
