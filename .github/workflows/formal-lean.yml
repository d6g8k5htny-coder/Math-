name: Formal Lean evidence (no scientific promotion)
on:
  workflow_call:
    outputs:
      checked_commit:
        description: Exact tested commit
        value: ${{ jobs.formal-evidence.outputs.checked_commit }}
      repository:
        description: Checked source repository
        value: ${{ jobs.formal-evidence.outputs.repository }}
      run_id:
        description: Producing workflow run
        value: ${{ jobs.formal-evidence.outputs.run_id }}
      run_attempt:
        description: Producing workflow attempt
        value: ${{ jobs.formal-evidence.outputs.run_attempt }}
      receipt_sha256:
        description: Original executed receipt SHA256
        value: ${{ jobs.formal-evidence.outputs.receipt_sha256 }}
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-evidence:
    outputs:
      checked_commit: ${{ steps.required-binding.outputs.checked_commit }}
      repository: ${{ steps.required-binding.outputs.repository }}
      run_id: ${{ steps.required-binding.outputs.run_id }}
      run_attempt: ${{ steps.required-binding.outputs.run_attempt }}
      receipt_sha256: ${{ steps.required-binding.outputs.receipt_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Gate tests and exact source identity
        run: |
          python3 -m unittest discover -s formal/tests -v
          python3 -O -m unittest discover -s formal/tests -v
          python3 formal/gate.py
      - name: Install pinned Lean and retrieve dependency cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: formal
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Build, recheck, audit axioms and execute negative controls
        run: python3 formal/gate.py --execute
      - name: TEST ONLY deliberate formal dependency failure NEVER MERGE
        run: exit 17
      - name: Bind current-run receipt to required check
        id: required-binding
        run: python3 -B -S tools/required_formal_check.py receipt
      - name: Preserve logs and exact-run receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: formal/.lake/formal-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
