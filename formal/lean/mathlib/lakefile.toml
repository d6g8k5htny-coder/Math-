name = "MathFormalReal"
defaultTargets = ["MathFormalReal"]

# Mathlib-dependent statement-and-proof layer. Pinned Mathlib tag v4.34.1
# (commit d13f23b723b8a846827a245b89c10fc7d3f11612 in lake-manifest.json) and the
# sibling core-only package for the exact rational constants.
# Scientific effect: NONE. `def ... : Prop` declarations are specifications only;
# theorems are kernel-checked proofs of exactly their written statement.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[require]]
name = "MathFormalCore"
path = "../core"

[[lean_lib]]
name = "MathFormalReal"
