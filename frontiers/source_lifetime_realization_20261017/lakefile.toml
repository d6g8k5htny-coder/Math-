[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "C291Inputs"
srcDir = "inputs"
roots = [
  "GaussianSeriesFoundation",
  "SourceC4",
  "SourceCovariance",
  "SourceFourierSeries",
  "SourceGaussianLaw",
  "SourceKernel",
  "SourceLattice",
  "SourceTorus",
  "SourceTorusC4",
  "SpectralWeights",
  "SourceSmooth",
  "SourceSmoothCarrier",
  "SourceSmoothControls",
  "Lifetime",
]

[[lean_lib]]
name = "SourceThetaBridge"

[[lean_lib]]
name = "SourceLifetimeGeometry"

[[lean_lib]]
name = "SourceLifetimeField"

[[lean_lib]]
name = "SourceLifetimeControls"

[[lean_lib]]
name = "SourceLifetimeAxiomAudit"
